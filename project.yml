# Safience's Xcode project, made from this file with XcodeGen
# (https://github.com/yonaskolb/XcodeGen): run `xcodegen` in this folder after
# adding or removing a file. Safience.xcodeproj is committed as generated, so
# building needs nothing but Xcode.
name: Safience
options:
  deploymentTarget:
    iOS: "17.0"
    # The Mac app is drawn in Liquid Glass throughout, which macOS has from 26.
    macOS: "26.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # Swift 5's language mode: what Swift 6's checks would stop is shown as
    # warnings where it is turned on (the iOS app, PadCore), one step at a
    # time (Docs/iPhoneDuoPlan.md, Phase E).
    SWIFT_VERSION: "5.0"
    SWIFT_EMIT_LOC_STRINGS: YES
    MARKETING_VERSION: "1.0.7"
    CURRENT_PROJECT_VERSION: "37"
packages:
  PadCore:
    path: PadCore
  # Updates for the Mac app people download (Safience Mac Direct only; the
  # Safience Mac target, run from Xcode, never has it). Pinned: a new version is a decision.
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.0
# What both Mac targets are: the one run from Xcode and the one people download.
targetTemplates:
  MacApp:
    type: application
    platform: macOS
    configFiles:
      Debug: Config/Mac.xcconfig
      Release: Config/Mac.xcconfig
    # What only the Mac has (Mac/), and what both apps compile (Shared/).
    sources:
      - path: Mac
      - path: Shared
    dependencies:
      - package: PadCore
    settings:
      base:
        PRODUCT_NAME: Safience
        PRODUCT_MODULE_NAME: SafienceMac
        INFOPLIST_FILE: Mac/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: Safience
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: YES
        ENABLE_PREVIEWS: NO
        COMBINE_HIDPI_IMAGES: YES
targets:
  Safience:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    # What only the iPhone and iPad have (App/), and what both apps compile (Shared/).
    sources:
      - path: App
      - path: Shared
    dependencies:
      - package: PadCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # Shared/Safience.icon, made with Icon Composer: Liquid Glass on iOS and
        # iPadOS 26 and later; Xcode draws flat pictures from it for earlier ones.
        ASSETCATALOG_COMPILER_APPICON_NAME: Safience
        # The icons Settings › App icon offers, each an Icon Composer file in App/.
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: Astro Designer Engineer Hardcover Punk Signal Vista
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        # Apple Intelligence's on-device model (Intelligence.swift) is iOS 26's;
        # linked weakly, the app still starts without it on iOS 17 and 18.
        OTHER_LDFLAGS: ["$(inherited)", "-weak_framework", "FoundationModels"]
        # Every data race Swift 6 would refuse, as a warning: the app is
        # main-thread by nature, but the workspace's saves, sites' icons and
        # the stores work off it.
        SWIFT_STRICT_CONCURRENCY: complete
        # Swift 6.2's defaults: an async function with no actor of its own
        # runs on its caller's (@concurrent sends it away), and conformances
        # and closures take the isolation they are written in.
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        # Everything on the main actor unless it says otherwise: what works
        # off it (the snapshots' files, the share sheet's file) says so.
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
  # Safience for Mac: the same spaces, pinned tabs and blocking, in a window
  # with Arc's sidebar down its side and the page beside it. Its own sources
  # in Mac/, with the few of the iPad's that are WebKit and Foundation only.
  Safience Mac:
    templates: [MacApp]
  # Safience for Mac as a disk image to download (Release/mac.sh): the same
  # app, with Sparkle to update itself (Mac/Sources/Updates.swift, DIRECT).
  Safience Mac Direct:
    templates: [MacApp]
    dependencies:
      - package: Sparkle
    settings:
      base:
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) DIRECT
        # Without iCloud unless Release/mac.sh says otherwise (ICLOUD=1).
        MAC_ENTITLEMENTS: Config/SafienceMacDirect.entitlements
        # Where updates are announced, and the key their disk images are
        # signed with (Release/mac.sh release; the private half is in the
        # Keychain of the Mac that releases, account "safience").
        SPARKLE_FEED_URL: https://github.com/taehee-pd/Safience/releases/latest/download/appcast.xml
        SPARKLE_PUBLIC_KEY: rK6S7D1ycM2mnd6WoTripO25xn0wVuV6ymEeI/+jlrc=
        ENABLE_USER_SCRIPT_SANDBOXING: NO
    postBuildScripts:
      # Sparkle's keys, in this target's Info.plist only (Mac/Info.plist is both apps').
      - name: Sparkle's keys in Info.plist
        basedOnDependencyAnalysis: false
        # After Xcode has written the app's Info.plist, which it orders by this.
        inputFiles:
          - $(TARGET_BUILD_DIR)/$(INFOPLIST_PATH)
        script: |
          plist="$TARGET_BUILD_DIR/$INFOPLIST_PATH"
          plutil -replace SUFeedURL -string "$SPARKLE_FEED_URL" "$plist"
          plutil -replace SUPublicEDKey -string "$SPARKLE_PUBLIC_KEY" "$plist"
          plutil -replace SUEnableAutomaticChecks -bool YES "$plist"
schemes:
  Safience:
    build:
      targets:
        Safience: all
    run:
      config: Debug
    archive:
      config: Release
  Safience Mac:
    build:
      targets:
        Safience Mac: all
    run:
      config: Debug
    archive:
      config: Release
  Safience Mac Direct:
    build:
      targets:
        Safience Mac Direct: all
    run:
      config: Debug
    archive:
      config: Release
