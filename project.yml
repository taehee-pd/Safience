# Safience's Xcode project, made from this file with XcodeGen
# (https://github.com/yonaskolb/XcodeGen): run `xcodegen` in this folder after
# adding or removing a file. Safience.xcodeproj is committed as generated, so
# building needs nothing but Xcode.
name: Safience
options:
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    # Swift 6's language mode adds strict concurrency checking, which buys
    # nothing in an app that is main-thread by nature.
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "5"
packages:
  PadCore:
    path: PadCore
targets:
  Safience:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Signing.xcconfig
      Release: Config/Signing.xcconfig
    sources:
      - path: App
    dependencies:
      - package: PadCore
    settings:
      base:
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
        SUPPORTS_XR_DESIGNED_FOR_IPHONE_IPAD: NO
        # App/Safience.icon, made with Icon Composer: Liquid Glass on iOS and
        # iPadOS 26 and later; Xcode draws flat pictures from it for earlier ones.
        ASSETCATALOG_COMPILER_APPICON_NAME: Safience
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
schemes:
  Safience:
    build:
      targets:
        Safience: all
    run:
      config: Debug
    archive:
      config: Release
