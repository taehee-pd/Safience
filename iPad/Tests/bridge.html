<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge tests</title>
<!--
  Tests for bridge.js, the script the iPad app puts into every page.

  Open it in Safari on a Mac to run it in WebKit, served over http so the
  frames count as one site:
      cd iPad && python3 -m http.server 8642
      open http://localhost:8642/Tests/bridge.html
  or run `node Tests/bridge.mjs` for Chromium (and WebKit, when Playwright
  has it), which adds the tests only a real trackpad event can drive.
  The results show on the page; window.__results has them for the runner.
-->
<style>
  html, body { margin: 0; font: 13px -apple-system, system-ui, sans-serif; }
  body { height: 3000px; position: relative; }
  .box { position: absolute; box-sizing: border-box; border: 1px solid #ccc; }
  #canvas { left: 0; top: 0; width: 400px; height: 300px; background: #f4f4f4; }
  #scroller { left: 420px; top: 0; width: 300px; height: 200px; overflow: auto; }
  #contained { left: 740px; top: 0; width: 200px; height: 200px; overflow: auto; overscroll-behavior: contain; }
  #hscroller { left: 0; top: 320px; width: 400px; height: 100px; overflow-x: auto; overflow-y: hidden; }
  #frame { left: 420px; top: 220px; width: 300px; height: 150px; border: 0; }
  #host { left: 740px; top: 220px; width: 200px; height: 150px; }
  #form { left: 0; top: 440px; width: 600px; height: 120px; border: 0; }
  #form input, #form textarea { margin: 4px; }
  #editor { display: inline-block; width: 120px; height: 24px; border: 1px solid #999; }
  #hidden { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; padding: 0; border: 0; }
  #report { position: absolute; left: 0; top: 600px; width: 900px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  .pass { color: #15803d; } .fail { color: #b91c1c; }
</style>

<div id="canvas" class="box"></div>
<div id="scroller" class="box"><div style="height: 1000px">scroller</div></div>
<div id="contained" class="box"><div style="height: 400px">contained</div></div>
<div id="hscroller" class="box"><div style="width: 1600px; height: 80px">wide</div></div>
<iframe id="frame" class="box" srcdoc="<!doctype html><style>html,body{margin:0;height:100%}#inner{height:100%;overflow:auto}</style><div id=inner><div style=height:900px>frame</div></div>"></iframe>
<div id="host" class="box"></div>
<div id="form" class="box">
  <input id="a" value="one">
  <input id="b" value="two">
  <textarea id="c"></textarea>
  <div id="editor" tabindex="0"></div>
  <input id="hidden">
  <input id="box" type="checkbox">
</div>
<div id="report"></div>

<script>
  // What the app's message handler would hear.
  window.__messages = [];
  window.webkit = { messageHandlers: { safience: { postMessage: (m) => window.__messages.push(m) } } };
  window.__safienceConfig = {
    adapter: 'test',
    css: 'html { --safience-test: 1; -webkit-touch-callout: none; }',
    handsOff: ['accounts.google.com'],
    wheel: 'auto',
    keys: ['tab', 'arrows'],
  };
</script>
<script src="../PadCore/Sources/PadCore/Scripts/bridge.js"></script>
<script>
(async () => {
  const results = [];
  const report = document.getElementById('report');
  function check(name, ok, detail = '') {
    results.push({ name, ok: !!ok, detail: String(detail) });
    const line = document.createElement('div');
    line.className = ok ? 'pass' : 'fail';
    line.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail && !ok ? '  (' + detail + ')' : '');
    report.appendChild(line);
  }
  const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const bridge = window.__safience;
  const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  // The app sends points in the web view; here the view is the window, so a
  // point is a CSS pixel and the view's width is the viewport's.
  const send = (m) => bridge.wheel(Object.assign({ width, dx: 0, dy: 0, guard: 'scroll' }, m));
  const reset = () => {
    window.scrollTo(0, 0);
    document.getElementById('scroller').scrollTop = 0;
    document.getElementById('hscroller').scrollLeft = 0;
    const contained = document.getElementById('contained');
    contained.scrollTop = contained.scrollHeight;
  };
  await new Promise((resolve) => (document.readyState === 'complete' ? resolve() : addEventListener('load', resolve)));
  await frame();

  check('the bridge is there, and frozen', bridge && Object.isFrozen(bridge));
  check('its settings are not left behind', !('__safienceConfig' in window));
  const styles = Array.from(document.querySelectorAll('style')).map((s) => s.textContent).join('\n');
  check('the stylesheet is added', styles.includes('--safience-test'));
  check('hello names the adapter', __messages.some((m) => m.kind === 'hello' && m.adapter === 'test'));

  // A canvas app, as Figma is: it takes every wheel, zooms on ctrl, pans
  // otherwise, and zooms by e^(-deltaY/100), Chrome's pinch convention.
  const canvas = document.getElementById('canvas');
  const app = { zoom: 1, panX: 0, panY: 0, events: [] };
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    app.events.push(event);
    if (event.ctrlKey) app.zoom *= Math.exp(-event.deltaY / 100);
    else { app.panX -= event.deltaX; app.panY -= event.deltaY; }
  }, { passive: false });

  // MARK: Pinch and ⌘ scroll

  reset();
  // A pinch to twice the size in ten steps, as Pinch.wheelDelta sends it.
  const step = Math.pow(2, 1 / 10);
  let outcome = '';
  for (let i = 0; i < 10; i++) {
    outcome = send({ x: 200, y: 150, dy: -100 * Math.log(step), ctrl: true, guard: 'pinch' });
  }
  check('a pinch reaches the canvas as ctrl+wheel', outcome === 'handled' && app.events.length === 10, outcome);
  check('the pinch zooms the canvas to twice the size', Math.abs(app.zoom - 2) < 1e-6, app.zoom);
  const first = app.events[0];
  check('at the pointer', first.clientX === 200 && first.clientY === 150, first.clientX + ',' + first.clientY);
  check('with ctrlKey and a negative deltaY', first.ctrlKey && first.deltaY < 0 && first.deltaMode === 0);
  check('cancelable and bubbling, as WebKit sends it', first.cancelable && first.bubbles);
  check('and marked as not from the system, which is all a page can tell', first.isTrusted === false);

  // ⌘ and two fingers: the same zoom, ⌘ itself not passed on.
  app.events = [];
  send({ x: 100, y: 100, dy: 50, ctrl: true });
  check('⌘ scroll zooms out with a positive deltaY', app.zoom < 2 && app.events[0].ctrlKey && !app.events[0].metaKey);

  // MARK: Two-finger scroll

  app.events = [];
  outcome = send({ x: 200, y: 150, dx: 5, dy: 30, shift: true });
  check('a scroll over the canvas is the canvas\'s', outcome === 'handled' && app.panY === -30 && app.panX === -5, outcome);
  check('keys held come along', app.events[0].shiftKey && !app.events[0].ctrlKey);
  check('the page did not move under it', window.scrollY === 0);

  reset();
  const scroller = document.getElementById('scroller');
  outcome = send({ x: 500, y: 100, dy: 120 });
  check('a scroll over a scroller nobody listens to scrolls it', outcome === 'scrolled' && scroller.scrollTop === 120, outcome + ' ' + scroller.scrollTop);
  check('and only it', window.scrollY === 0);

  reset();
  scroller.scrollTop = scroller.scrollHeight;
  outcome = send({ x: 500, y: 100, dy: 80 });
  check('at its end, the scroll goes on to the page', outcome === 'scrolled' && window.scrollY === 80, outcome + ' ' + window.scrollY);

  reset();
  const contained = document.getElementById('contained');
  const before = contained.scrollTop;
  outcome = send({ x: 840, y: 100, dy: 80 });
  check('overscroll-behavior: contain keeps it there', outcome === 'ignored' && window.scrollY === 0 && contained.scrollTop === before, outcome);

  reset();
  outcome = send({ x: 840, y: 100, dy: -60 });
  check('and it still scrolls itself', outcome === 'scrolled' && contained.scrollTop < before, outcome);

  reset();
  const hscroller = document.getElementById('hscroller');
  outcome = send({ x: 200, y: 370, dx: 90 });
  check('sideways scrolls sideways', outcome === 'scrolled' && hscroller.scrollLeft === 90, outcome + ' ' + hscroller.scrollLeft);

  reset();
  outcome = send({ x: 1100, y: 500, dy: 200 });
  check('anywhere else the page scrolls', outcome === 'scrolled' && window.scrollY === 200, outcome + ' ' + window.scrollY);

  reset();
  outcome = send({ x: 1100, y: 500, dy: -50 });
  check('at the top, up is nothing to scroll', outcome === 'ignored' && window.scrollY === 0, outcome);

  reset();
  document.documentElement.style.overflow = 'hidden';
  outcome = send({ x: 1100, y: 500, dy: 200 });
  check('a page that hides its overflow does not scroll', outcome === 'ignored' && window.scrollY === 0, outcome);
  document.documentElement.style.overflow = '';

  // A desktop page twice as wide as the view, scaled down to fit: two CSS
  // pixels to a point.
  reset();
  app.events = [];
  bridge.wheel({ width: width / 2, x: 100, y: 75, dx: 0, dy: 10, guard: 'scroll' });
  check('points become CSS pixels at the page\'s scale', app.events[0] && app.events[0].clientX === 200 && app.events[0].clientY === 150,
    app.events[0] && (app.events[0].clientX + ',' + app.events[0].clientY));

  // MARK: Frames and shadow roots

  reset();
  const inner = document.getElementById('frame').contentDocument.getElementById('inner');
  let frameEvent = null;
  inner.addEventListener('wheel', (event) => { frameEvent = event; });
  outcome = send({ x: 470, y: 250, dy: 40 });
  check('into a frame of the same site', frameEvent && frameEvent.clientX === 50 && frameEvent.clientY === 30,
    frameEvent && (frameEvent.clientX + ',' + frameEvent.clientY));
  check('which scrolls inside the frame', outcome === 'scrolled' && inner.scrollTop === 40 && window.scrollY === 0, outcome + ' ' + inner.scrollTop);

  reset();
  const host = document.getElementById('host');
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = '<div id="deep" style="width:100%;height:100%"></div>';
  let shadowTarget = null;
  shadow.getElementById('deep').addEventListener('wheel', (event) => { shadowTarget = event.target; event.preventDefault(); });
  outcome = send({ x: 800, y: 260, dy: 10 });
  check('into an open shadow root', outcome === 'handled' && shadowTarget && shadowTarget.id === 'deep', outcome);

  // MARK: Keys

  const a = document.getElementById('a');
  const b = document.getElementById('b');
  const c = document.getElementById('c');
  const editor = document.getElementById('editor');
  a.focus();
  outcome = bridge.key({ key: 'Tab', code: 'Tab' });
  check('Tab moves to the next field', outcome === 'default' && document.activeElement === b, outcome);
  check('and selects its text', b.selectionStart === 0 && b.selectionEnd === b.value.length);
  bridge.key({ key: 'Tab', code: 'Tab', shift: true });
  check('⇧Tab goes back', document.activeElement === a);

  let seen = null;
  editor.addEventListener('keydown', (event) => {
    seen = event;
    if (event.key === 'Tab') event.preventDefault();
  });
  editor.focus();
  outcome = bridge.key({ key: 'Tab', code: 'Tab' });
  check('a page that takes Tab keeps the focus', outcome === 'handled' && document.activeElement === editor, outcome);
  check('the old keyCode is there for old code', seen && seen.keyCode === 9 && seen.which === 9 && seen.code === 'Tab');

  reset();
  c.blur();
  editor.blur();
  document.body.focus();
  outcome = bridge.key({ key: 'ArrowDown', code: 'ArrowDown' });
  check('an arrow outside a field scrolls the page', outcome === 'default' && window.scrollY === 40, outcome + ' ' + window.scrollY);
  reset();
  c.focus();
  bridge.key({ key: 'ArrowDown', code: 'ArrowDown' });
  check('an arrow in a field leaves the page where it is', window.scrollY === 0);

  // MARK: Reports

  // Reports are sent on a change only, so each check starts from the other state.
  document.getElementById('hidden').focus();
  await wait(20);
  __messages.length = 0;
  a.focus();
  await wait(20);
  check('a visible field says the keys are for typing', __messages.some((m) => m.kind === 'focus' && m.editing === true));
  __messages.length = 0;
  document.getElementById('hidden').focus();
  await wait(20);
  check('a hidden one says they are not', __messages.some((m) => m.kind === 'focus' && m.editing === false));

  check('no password field yet', bridge.state().password === false);
  __messages.length = 0;
  const password = document.createElement('input');
  password.type = 'Password';
  document.getElementById('form').appendChild(password);
  await wait(600);
  check('a password field makes it a sign-in page', __messages.some((m) => m.kind === 'password' && m.present === true));

  check('nothing typed, nothing to lose', bridge.unsaved() === false);
  document.getElementById('box').checked = true;
  check('a ticked box is not typing', bridge.unsaved() === false);
  b.value = 'something typed';
  check('something typed is kept from freezing', bridge.unsaved() === true);
  b.value = b.defaultValue;

  const state = bridge.state();
  check('state reports what Diagnostics shows', typeof state.userAgent === 'string' && state.bridged > 0 && state.adapter === 'test');

  // MARK: Hands off

  const off = document.createElement('iframe');
  off.src = 'handsoff.html';
  document.body.appendChild(off);
  await new Promise((resolve) => off.addEventListener('load', resolve, { once: true }));
  await wait(50);
  const offWindow = off.contentWindow;
  check('on a hands-off host it does nothing at all', offWindow.__ready === true && !('__safience' in offWindow) &&
    offWindow.__messages.length === 0 && offWindow.document.querySelectorAll('style').length === 0);

  window.__results = results;
  const failed = results.filter((r) => !r.ok).length;
  document.title = failed ? 'FAILED ' + failed : 'PASSED ' + results.length;
})().catch((error) => {
  window.__results = [{ name: 'the test page itself', ok: false, detail: String(error && error.stack || error) }];
  document.title = 'FAILED';
});
</script>
