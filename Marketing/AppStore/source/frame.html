<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:var(--w);height:var(--h);overflow:hidden}
body{font-family:-apple-system,"SF Pro Display",system-ui,sans-serif;-webkit-font-smoothing:antialiased;color:#111110;
 background:linear-gradient(180deg,#f2f2ea 0%,#e4e4d8 55%,#d6d7c8 100%);position:relative}
.ring{position:absolute;opacity:.13;pointer-events:none}
/* One line of copy, the only words on the picture. */
.copy{position:absolute;left:0;right:0;top:var(--copyTop);text-align:center;padding:0 var(--copyPad)}
.copy p{font-size:var(--copySize);line-height:1.14;letter-spacing:-.032em;font-weight:680;color:#111110;text-wrap:balance}
/* The whole device at its screen's own shape; the bezel's corners follow the
   screen's. On iPad it is large and low enough that the picture's edge crops
   it; on iPhone it shows whole, since its bar is at the bottom. */
.device{position:absolute;left:50%;transform:translateX(-50%);top:var(--top);padding:var(--bezel);
 border-radius:calc(var(--radius) + var(--bezel));background:#0d0d0c;
 box-shadow:0 2px 0 1px rgba(255,255,255,.35) inset,0 80px 160px -40px rgba(40,40,20,.45),0 30px 60px -30px rgba(0,0,0,.35)}
.screen{position:relative;width:var(--sw);aspect-ratio:var(--sr);border-radius:var(--radius);overflow:hidden;background:#fff}
.screen img{display:block;width:100%;height:100%;object-fit:cover;object-position:top}
/* The iPhone's Dynamic Island, drawn on every shot: the simulator's captures
   have it only now and then. */
.island{position:absolute;left:50%;transform:translateX(-50%);top:3.18%;width:28.2%;height:auto;aspect-ratio:372/108;
 border-radius:999px;background:#000;display:none}
</style></head><body>
<img class="ring" id="ring" src="../../../App/Safience.icon/Assets/icon.png">
<div class="copy"><p id="s"></p></div>
<div class="device"><div class="screen"><img id="shot"><div class="island" id="island"></div></div></div>
<script>
// Defaults are the iPad's (13-inch, 2064 by 2752); frames-*.json sets the rest.
const q=new URLSearchParams(location.search);
const n=(k,d)=>Number(q.get(k)||d);
document.getElementById('s').innerHTML=q.get('s');
document.getElementById('shot').src=q.get('img');
const g=document.getElementById('ring');const rp=(q.get('ring')||'1200,600,1400').split(',').map(Number);
g.style.left=rp[0]+'px';g.style.top=rp[1]+'px';g.style.width=rp[2]+'px';
const sw=n('sw',1800), bezel=n('bezel',28);
const st=document.documentElement.style;
st.setProperty('--w',n('w',2064)+'px');st.setProperty('--h',n('h',2752)+'px');
st.setProperty('--sw',sw+'px');st.setProperty('--sr',q.get('sr')||'2064/2752');
st.setProperty('--bezel',bezel+'px');st.setProperty('--radius',Math.round(sw*n('rad',0.03))+'px');
st.setProperty('--top',(q.get('top')||'560')+'px');st.setProperty('--copyTop',(q.get('ct')||'210')+'px');
st.setProperty('--copySize',n('cs',88)+'px');st.setProperty('--copyPad',n('cp',120)+'px');
if(q.get('island'))document.getElementById('island').style.display='block';
</script></body></html>
