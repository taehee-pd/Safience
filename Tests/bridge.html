<!doctype html>
<meta charset="utf-8">
<meta name="description" content="Synthetic account B description that must stay out of unbound messages">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bridge tests</title>
<link rel="icon" href="icon-16.png" sizes="16x16">
<link rel="apple-touch-icon" href="touch.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="mask-icon" href="mask.png">
<link rel="icon" href="icon-48.png" sizes="48x48">
<link rel="icon" href="icon-dark.png" sizes="64x64" media="(prefers-color-scheme: dark)">
<!--
  Tests for bridge.js, the script Safience puts into every page.

  Open it in Safari on a Mac to run it in WebKit, served over http so the
  frames count as one site, from the repository's root:
      python3 -m http.server 8642
      open http://localhost:8642/Tests/bridge.html
  or run `node Tests/bridge.mjs` for Chromium (and WebKit, when Playwright
  has it), which adds the tests only a real trackpad event can drive.
  The results show on the page; window.__results has them for the runner.
-->
<style>
  html, body { margin: 0; font: 13px -apple-system, system-ui, sans-serif; }
  body { height: 3000px; position: relative; }
  .box { position: absolute; box-sizing: border-box; border: 1px solid #ccc; }
  #canvas { left: 0; top: 0; width: 400px; height: 300px; background: #f4f4f4; }
  #scroller { left: 420px; top: 0; width: 300px; height: 200px; overflow: auto; }
  #contained { left: 740px; top: 0; width: 200px; height: 200px; overflow: auto; overscroll-behavior: contain; }
  #hscroller { left: 0; top: 320px; width: 400px; height: 100px; overflow-x: auto; overflow-y: hidden; }
  #frame { left: 420px; top: 220px; width: 300px; height: 150px; border: 0; }
  #host { left: 740px; top: 220px; width: 200px; height: 150px; }
  #form { left: 0; top: 440px; width: 600px; height: 120px; border: 0; }
  #form input, #form textarea { margin: 4px; }
  #editor { display: inline-block; width: 120px; height: 24px; border: 1px solid #999; }
  #hidden { position: absolute; left: 0; top: 0; width: 1px; height: 1px; opacity: 0; padding: 0; border: 0; }
  #desk { left: 620px; top: 440px; width: 320px; height: 120px; }
  #report { position: absolute; left: 0; top: 600px; width: 900px; white-space: pre-wrap; font-family: ui-monospace, monospace; }
  .pass { color: #15803d; } .fail { color: #b91c1c; }
  #press:hover { color: rgb(1, 2, 3); }
  @media (hover: none) { #press:hover { color: rgb(9, 9, 9); } }
  @media (hover: hover) and (pointer: fine) { #press:hover { background-color: rgb(4, 5, 6); } }
</style>

<div id="canvas" class="box"></div>
<div id="scroller" class="box"><div style="height: 1000px">scroller</div></div>
<div id="contained" class="box"><div style="height: 400px">contained</div></div>
<div id="hscroller" class="box"><div style="width: 1600px; height: 80px">wide</div></div>
<iframe id="frame" class="box" srcdoc="<!doctype html><style>html,body{margin:0;height:100%}#inner{height:100%;overflow:auto}</style><div id=inner><div style=height:900px>frame</div></div>"></iframe>
<div id="host" class="box"></div>
<div id="form" class="box">
  <input id="a" value="one">
  <input id="b" value="two">
  <textarea id="c"></textarea>
  <div id="editor" tabindex="0"></div>
  <input id="hidden">
  <input id="box" type="checkbox">
</div>
<div id="desk" class="box">
  <button id="press">press</button>
  <form id="send" action="javascript:void 0"><input id="field" value=""></form>
  <div id="note" contenteditable="true" style="width: 200px; height: 24px; border: 1px solid #999"></div>
</div>
<div id="report"></div>
<!-- The result in one piece, for a runner that reads an element and not the title. -->
<pre id="out" hidden>running</pre>

<script>
  // What the app's message handler would hear.
  window.__messages = [];
  window.webkit = { messageHandlers: { safience: { postMessage: (m) => window.__messages.push(m) } } };
  window.__safienceConfig = {
    adapter: 'test',
    css: 'html { --safience-test: 1; -webkit-touch-callout: none; }',
    handsOff: ['accounts.google.com'],
    wheel: 'auto',
    keys: ['tab', 'arrows'],
  };
</script>
<script src="load-bridge.js"></script>
<script>
(async () => {
  await window.__bridgeReady;
  const results = [];
  const report = document.getElementById('report');
  function check(name, ok, detail = '') {
    results.push({ name, ok: !!ok, detail: String(detail) });
    const line = document.createElement('div');
    line.className = ok ? 'pass' : 'fail';
    line.textContent = (ok ? 'PASS ' : 'FAIL ') + name + (detail && !ok ? '  (' + detail + ')' : '');
    report.appendChild(line);
    // As far as it has come, should the page stop before its end.
    const failed = results.filter((r) => !r.ok);
    document.getElementById('out').textContent = results.length + ' checked, ' + failed.length + ' failed\n'
      + failed.map((r) => 'FAIL ' + r.name + '  (' + r.detail + ')').join('\n');
  }
  const frame = () => new Promise((resolve) => requestAnimationFrame(() => resolve()));
  const wait = (ms) => new Promise((resolve) => setTimeout(resolve, ms));
  const bridge = window.__safience;
  const standaloneDraft = new Function('handsOff', window.__draftCall);
  function hasDraft() {
    const bridged = bridge.unsaved();
    const standalone = standaloneDraft(['accounts.google.com']);
    if (bridged !== standalone) throw new Error('The bridge and standalone draft probes disagree');
    return bridged;
  }
  const width = window.visualViewport ? window.visualViewport.width : window.innerWidth;
  // The app sends points in the web view; here the view is the window, so a
  // point is a CSS pixel and the view's width is the viewport's.
  const send = (m) => bridge.wheel(Object.assign({ width, dx: 0, dy: 0, guard: 'scroll' }, m));
  const reset = () => {
    window.scrollTo(0, 0);
    document.getElementById('scroller').scrollTop = 0;
    document.getElementById('hscroller').scrollLeft = 0;
    const contained = document.getElementById('contained');
    contained.scrollTop = contained.scrollHeight;
  };
  await new Promise((resolve) => (document.readyState === 'complete' ? resolve() : addEventListener('load', resolve)));
  await frame();

  check('the bridge is there, and frozen', bridge && Object.isFrozen(bridge));
  check('its settings are not left behind', !('__safienceConfig' in window));
  const styles = Array.from(document.querySelectorAll('style')).map((s) => s.textContent).join('\n');
  check('the stylesheet is added', styles.includes('--safience-test'));
  check('hello names the adapter', __messages.some((m) => m.kind === 'hello' && m.adapter === 'test'));
  await wait(350);
  check('history descriptions never leave the bridge as unbound document messages',
    !__messages.some((m) => m.kind === 'about' || (m.text || '').includes('Synthetic account B description')));

  // A canvas app, as Figma is: it takes every wheel, zooms on ctrl, pans
  // otherwise, and zooms by e^(-deltaY/100), Chrome's pinch convention.
  const canvas = document.getElementById('canvas');
  const app = { zoom: 1, panX: 0, panY: 0, events: [] };
  canvas.addEventListener('wheel', (event) => {
    event.preventDefault();
    app.events.push(event);
    if (event.ctrlKey) app.zoom *= Math.exp(-event.deltaY / 100);
    else { app.panX -= event.deltaX; app.panY -= event.deltaY; }
  }, { passive: false });

  // MARK: Pinch and ⌘ scroll

  reset();
  // A pinch to twice the size in ten steps, as Pinch.wheelDelta sends it.
  const step = Math.pow(2, 1 / 10);
  let outcome = '';
  for (let i = 0; i < 10; i++) {
    outcome = send({ x: 200, y: 150, dy: -100 * Math.log(step), ctrl: true, guard: 'pinch' });
  }
  check('a pinch reaches the canvas as ctrl+wheel', outcome === 'handled' && app.events.length === 10, outcome);
  check('the pinch zooms the canvas to twice the size', Math.abs(app.zoom - 2) < 1e-6, app.zoom);
  const first = app.events[0];
  check('at the pointer', first.clientX === 200 && first.clientY === 150, first.clientX + ',' + first.clientY);
  check('with ctrlKey and a negative deltaY', first.ctrlKey && first.deltaY < 0 && first.deltaMode === 0);
  check('cancelable and bubbling, as WebKit sends it', first.cancelable && first.bubbles);
  check('and marked as not from the system, which is all a page can tell', first.isTrusted === false);

  // ⌘ and two fingers: the same zoom, ⌘ itself not passed on.
  app.events = [];
  send({ x: 100, y: 100, dy: 50, ctrl: true });
  check('⌘ scroll zooms out with a positive deltaY', app.zoom < 2 && app.events[0].ctrlKey && !app.events[0].metaKey);

  // MARK: Two-finger scroll

  app.events = [];
  outcome = send({ x: 200, y: 150, dx: 5, dy: 30, shift: true });
  check('a scroll over the canvas is the canvas\'s', outcome === 'handled' && app.panY === -30 && app.panX === -5, outcome);
  check('keys held come along', app.events[0].shiftKey && !app.events[0].ctrlKey);
  check('the page did not move under it', window.scrollY === 0);

  reset();
  const scroller = document.getElementById('scroller');
  outcome = send({ x: 500, y: 100, dy: 120 });
  check('a scroll over a scroller nobody listens to scrolls it', outcome === 'scrolled' && scroller.scrollTop === 120, outcome + ' ' + scroller.scrollTop);
  check('and only it', window.scrollY === 0);

  reset();
  scroller.scrollTop = scroller.scrollHeight;
  outcome = send({ x: 500, y: 100, dy: 80 });
  check('at its end, the scroll goes on to the page', outcome === 'scrolled' && window.scrollY === 80, outcome + ' ' + window.scrollY);

  reset();
  const contained = document.getElementById('contained');
  const before = contained.scrollTop;
  outcome = send({ x: 840, y: 100, dy: 80 });
  check('overscroll-behavior: contain keeps it there', outcome === 'ignored' && window.scrollY === 0 && contained.scrollTop === before, outcome);

  reset();
  outcome = send({ x: 840, y: 100, dy: -60 });
  check('and it still scrolls itself', outcome === 'scrolled' && contained.scrollTop < before, outcome);

  reset();
  const hscroller = document.getElementById('hscroller');
  outcome = send({ x: 200, y: 370, dx: 90 });
  check('sideways scrolls sideways', outcome === 'scrolled' && hscroller.scrollLeft === 90, outcome + ' ' + hscroller.scrollLeft);

  reset();
  outcome = send({ x: 1100, y: 500, dy: 200 });
  check('anywhere else the page scrolls', outcome === 'scrolled' && window.scrollY === 200, outcome + ' ' + window.scrollY);

  reset();
  outcome = send({ x: 1100, y: 500, dy: -50 });
  check('at the top, up is nothing to scroll', outcome === 'ignored' && window.scrollY === 0, outcome);

  reset();
  document.documentElement.style.overflow = 'hidden';
  outcome = send({ x: 1100, y: 500, dy: 200 });
  check('a page that hides its overflow does not scroll', outcome === 'ignored' && window.scrollY === 0, outcome);
  document.documentElement.style.overflow = '';

  // A desktop page twice as wide as the view, scaled down to fit: two CSS
  // pixels to a point.
  reset();
  app.events = [];
  bridge.wheel({ width: width / 2, x: 100, y: 75, dx: 0, dy: 10, guard: 'scroll' });
  check('points become CSS pixels at the page\'s scale', app.events[0] && app.events[0].clientX === 200 && app.events[0].clientY === 150,
    app.events[0] && (app.events[0].clientX + ',' + app.events[0].clientY));

  // MARK: Frames and shadow roots

  reset();
  const inner = document.getElementById('frame').contentDocument.getElementById('inner');
  let frameEvent = null;
  inner.addEventListener('wheel', (event) => { frameEvent = event; });
  outcome = send({ x: 470, y: 250, dy: 40 });
  check('into a frame of the same site', frameEvent && frameEvent.clientX === 50 && frameEvent.clientY === 30,
    frameEvent && (frameEvent.clientX + ',' + frameEvent.clientY));
  check('which scrolls inside the frame', outcome === 'scrolled' && inner.scrollTop === 40 && window.scrollY === 0, outcome + ' ' + inner.scrollTop);

  reset();
  const host = document.getElementById('host');
  const shadow = host.attachShadow({ mode: 'open' });
  shadow.innerHTML = '<div id="deep" style="width:100%;height:100%"></div>';
  let shadowTarget = null;
  shadow.getElementById('deep').addEventListener('wheel', (event) => { shadowTarget = event.target; event.preventDefault(); });
  outcome = send({ x: 800, y: 260, dy: 10 });
  check('into an open shadow root', outcome === 'handled' && shadowTarget && shadowTarget.id === 'deep', outcome);

  // MARK: Pages whose own layout does the scrolling

  // A page of its own over the corner of this one, taken away after. Over
  // the whole of the window's left side where what is further along the
  // pointer's column counts: nothing of this page is in that column then.
  async function framed(html, height = '200px') {
    const shell = document.createElement('iframe');
    shell.style.cssText = 'position: fixed; left: 0; top: 0; width: 300px; height: ' + height + '; z-index: 99; border: 0; background: #fff';
    shell.srcdoc = html;
    document.body.appendChild(shell);
    await new Promise((resolve) => shell.addEventListener('load', resolve, { once: true }));
    await frame();
    return shell;
  }

  // `html, body { overflow-x: hidden }` with a height on both, as many a page has: the body scrolls inside itself.
  reset();
  let shell = await framed('<!doctype html><style>html,body{margin:0;height:100%;overflow-x:hidden}</style><div style="height:900px">tall</div>');
  outcome = send({ x: 100, y: 100, dy: 60 });
  check('a body that scrolls inside itself is scrolled', outcome === 'scrolled' && shell.contentDocument.body.scrollTop === 60 && window.scrollY === 0,
    outcome + ' body ' + shell.contentDocument.body.scrollTop + ' root ' + shell.contentDocument.documentElement.scrollTop);
  shell.remove();

  // A component that keeps a scroller round its slot: what the page put in the slot is inside the scroller.
  const slotted = document.createElement('div');
  slotted.style.cssText = 'position: fixed; left: 0; top: 0; width: 300px; height: 200px; z-index: 99; background: #fff';
  slotted.attachShadow({ mode: 'open' }).innerHTML = '<div id="pane" style="height: 200px; overflow: auto"><slot></slot></div>';
  slotted.innerHTML = '<div style="height: 900px">slotted</div>';
  document.body.appendChild(slotted);
  await frame();
  outcome = send({ x: 100, y: 100, dy: 50 });
  check('what a component scrolls round its slot is scrolled', outcome === 'scrolled' && slotted.shadowRoot.getElementById('pane').scrollTop === 50
    && window.scrollY === 0, outcome + ' ' + slotted.shadowRoot.getElementById('pane').scrollTop);
  slotted.remove();

  // An app that fills the window: a bar at the top, a list that scrolls, a field at the bottom.
  const shellFoot = window.innerHeight - 10;
  const shellMiddle = window.innerHeight / 2;
  shell = await framed('<!doctype html><style>html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column}'
    + '#list{flex:1;min-height:0;overflow:auto}#head,#bar{height:40px;flex:none}</style>'
    + '<div id="head">head</div><div id="list"><div style="height:9000px">messages</div></div><div id="bar">field</div>', '100vh');
  const list = shell.contentDocument.getElementById('list');
  outcome = send({ x: 100, y: shellFoot, dy: 60 });
  check('over a bar with nothing to scroll, nothing scrolls, as on a computer', outcome === 'ignored' && list.scrollTop === 0, outcome + ' ' + list.scrollTop);
  outcome = send({ x: 100, y: shellFoot, dy: 60, reach: true });
  check('in the desktop view the scroll reaches what is further up the column', outcome === 'scrolled' && list.scrollTop === 60, outcome + ' ' + list.scrollTop);
  outcome = send({ x: 100, y: 10, dy: -40, reach: true });
  check('and from the bar at the top, back up', outcome === 'scrolled' && list.scrollTop === 20, outcome + ' ' + list.scrollTop);
  list.scrollTop = list.scrollHeight;
  const listEnd = list.scrollTop;
  outcome = send({ x: 100, y: shellMiddle, dy: 60, reach: true });
  check('a list at its end keeps the scroll', outcome === 'ignored' && list.scrollTop === listEnd, outcome + ' ' + list.scrollTop);
  outcome = send({ x: 100, y: shellFoot, dy: 60, reach: true });
  check('and from the bar under it there is no further to go', outcome === 'ignored' && list.scrollTop === listEnd && window.scrollY === 0,
    outcome + ' ' + list.scrollTop + ' ' + window.scrollY);
  shell.remove();

  // An app that keeps its matter in a frame, over a bar of its own: what scrolls there is the frame's document.
  shell = await framed('<!doctype html><style>html,body{margin:0;height:100%;overflow:hidden}body{display:flex;flex-direction:column}'
    + 'iframe{flex:1;min-height:0;border:0}#bar{height:40px;flex:none}</style>'
    + '<iframe srcdoc="<!doctype html><body style=&quot;margin:0&quot;><div style=&quot;height:9000px&quot;>matter</div>"></iframe><div id="bar">bar</div>', '100vh');
  const matter = shell.contentDocument.querySelector('iframe').contentWindow;
  outcome = send({ x: 100, y: shellFoot, dy: 60 });
  check('a frame under the bar is left as it is by a scroll over the bar', outcome === 'ignored' && matter.scrollY === 0, outcome + ' ' + matter.scrollY);
  outcome = send({ x: 100, y: shellFoot, dy: 60, reach: true });
  check('and in the desktop view its document is what the scroll reaches', outcome === 'scrolled' && matter.scrollY === 60 && window.scrollY === 0,
    outcome + ' ' + matter.scrollY + ' ' + window.scrollY);
  shell.remove();

  // The other way about: the pointer left in a frame of the page's own that has nothing to scroll, on a page that has.
  shell = await framed('<!doctype html><body style="margin:0">'
    + '<iframe style="display:block;width:300px;height:60px;border:0" srcdoc="<!doctype html><body style=&quot;margin:0;overflow:hidden&quot;>player"></iframe>'
    + '<div style="height:9000px">page</div>', '100vh');
  outcome = send({ x: 100, y: 20, dy: 50, reach: true });
  check('from a frame with nothing to scroll, the scroll reaches the page round it', outcome === 'scrolled' && shell.contentWindow.scrollY === 50
    && window.scrollY === 0, outcome + ' ' + shell.contentWindow.scrollY + ' ' + window.scrollY);
  shell.remove();

  // A scroller that snaps to its parts goes a part a stroke: moved by each small step it went a part a step, and one
  // stroke was the end of it. (How far the part has come in by now is the engine's: it is brought in smoothly.)
  const snapping = document.createElement('div');
  snapping.style.cssText = 'position: fixed; left: 0; top: 0; width: 300px; height: 200px; z-index: 99; overflow-y: auto; scroll-snap-type: y mandatory; background: #fff';
  snapping.innerHTML = [1, 2, 3, 4, 5, 6].map((n) => '<div style="height: 200px; scroll-snap-align: start">' + n + '</div>').join('');
  document.body.appendChild(snapping);
  let turned = [];
  for (let step = 0; step < 10; step++) turned.push(send({ x: 100, y: 100, dy: 30 }));
  check('a stroke over a scroller that snaps turns one part and no more', turned.every((one) => one === 'scrolled') && snapping.scrollTop <= 200
    && window.scrollY === 0, turned.join() + ' ' + snapping.scrollTop);
  // A row of cards that snaps sideways, with the page free to scroll under it: up and down is still the page's.
  snapping.style.cssText += '; overflow-y: hidden; overflow-x: auto; scroll-snap-type: x mandatory; white-space: nowrap';
  snapping.innerHTML = [1, 2, 3, 4].map((n) => '<div style="display: inline-block; width: 300px; height: 180px; scroll-snap-align: start">' + n + '</div>').join('');
  turned = [];
  for (let step = 0; step < 10; step++) turned.push(send({ x: 100, y: 100, dx: 30 }));
  check('and sideways the same', turned.every((one) => one === 'scrolled') && snapping.scrollLeft <= 300, turned.join() + ' ' + snapping.scrollLeft);
  outcome = send({ x: 100, y: 100, dy: 70 });
  check('while the other way goes on to the page, freely', outcome === 'scrolled' && window.scrollY === 70, outcome + ' ' + window.scrollY);
  snapping.remove();
  // One that snaps both ways (a board of cards) turns once a stroke, the way the stroke first went: a second scroll
  // begun on a scroller ends the first where it has got to. (A scroller of its own: the one above is in mid stroke.)
  const board = document.createElement('div');
  board.style.cssText = 'position: fixed; left: 0; top: 0; width: 300px; height: 200px; z-index: 99; overflow: auto; scroll-snap-type: both mandatory; background: #fff';
  board.innerHTML = '<div style="width: 900px">' + [1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) =>
    '<div style="float: left; width: 300px; height: 200px; scroll-snap-align: start">' + n + '</div>').join('') + '</div>';
  document.body.appendChild(board);
  const turns = [];
  board.scrollBy = (how) => turns.push(how);
  for (let step = 0; step < 10; step++) send({ x: 100, y: 100, dx: 30, dy: 30 });
  check('one that snaps both ways turns once a stroke, one way', turns.length === 1 && ('left' in turns[0]) !== ('top' in turns[0]), JSON.stringify(turns));
  board.remove();
  reset();

  // MARK: Keys

  const a = document.getElementById('a');
  const b = document.getElementById('b');
  const c = document.getElementById('c');
  const editor = document.getElementById('editor');
  a.focus();
  outcome = bridge.key({ key: 'Tab', code: 'Tab' });
  check('Tab moves to the next field', outcome === 'default' && document.activeElement === b, outcome);
  check('and selects its text', b.selectionStart === 0 && b.selectionEnd === b.value.length);
  bridge.key({ key: 'Tab', code: 'Tab', shift: true });
  check('⇧Tab goes back', document.activeElement === a);

  // A field inside a shadow root, between a and b: Tab goes on to b, not
  // back to the page's first field.
  const pocket = document.createElement('div');
  a.insertAdjacentElement('afterend', pocket);
  const pocketField = document.createElement('input');
  pocket.attachShadow({ mode: 'open' }).append(pocketField);
  pocketField.focus();
  outcome = bridge.key({ key: 'Tab', code: 'Tab' });
  check('Tab from inside a shadow root goes to the next field after its host', outcome === 'default' && document.activeElement === b, document.activeElement && document.activeElement.id);
  pocketField.focus();
  bridge.key({ key: 'Tab', code: 'Tab', shift: true });
  check('⇧Tab from inside a shadow root goes to the field before its host', document.activeElement === a, document.activeElement && document.activeElement.id);
  pocket.remove();

  let seen = null;
  editor.addEventListener('keydown', (event) => {
    seen = event;
    if (event.key === 'Tab') event.preventDefault();
  });
  editor.focus();
  outcome = bridge.key({ key: 'Tab', code: 'Tab' });
  check('a page that takes Tab keeps the focus', outcome === 'handled' && document.activeElement === editor, outcome);
  check('the old keyCode is there for old code', seen && seen.keyCode === 9 && seen.which === 9 && seen.code === 'Tab');

  reset();
  c.blur();
  editor.blur();
  document.body.focus();
  outcome = bridge.key({ key: 'ArrowDown', code: 'ArrowDown' });
  check('an arrow outside a field scrolls the page', outcome === 'default' && window.scrollY === 40, outcome + ' ' + window.scrollY);
  reset();
  c.focus();
  bridge.key({ key: 'ArrowDown', code: 'ArrowDown' });
  check('an arrow in a field leaves the page where it is', window.scrollY === 0);

  // MARK: The iPhone's desktop view

  reset();
  const middle = (element) => {
    const box = element.getBoundingClientRect();
    return { x: box.left + box.width / 2, y: box.top + box.height / 2, width: innerWidth };
  };
  const press = document.getElementById('press');
  const pressLog = [];
  for (const type of ['pointerover', 'pointerenter', 'mouseover', 'mouseenter', 'pointermove', 'mousemove', 'pointerdown',
    'mousedown', 'pointerup', 'mouseup', 'click', 'dblclick', 'contextmenu', 'pointerout', 'pointerleave', 'mouseleave']) {
    press.addEventListener(type, (e) => pressLog.push([type, e.detail, e.button, e.pointerType || ''].join(':')));
  }
  const plain = getComputedStyle(press).color;
  bridge.pointer(Object.assign({ type: 'move' }, middle(press)));
  const hoverStyle = getComputedStyle(press);
  check('the cursor coming over an element gives it its :hover styles', hoverStyle.color === 'rgb(1, 2, 3)' &&
    plain !== 'rgb(1, 2, 3)', hoverStyle.color);
  check('and the ones for a pointer that hovers, not the ones for none', hoverStyle.backgroundColor === 'rgb(4, 5, 6)',
    hoverStyle.backgroundColor);
  const moved = pressLog.map((l) => l.split(':')[0]);
  check('the cursor coming over an element is over, enter and move, pointer before mouse',
    moved.join() === 'pointerover,mouseover,pointerenter,mouseenter,pointermove,mousemove', moved.join());
  check('as a mouse', pressLog[0].endsWith(':mouse'), pressLog[0]);
  pressLog.length = 0;
  outcome = bridge.pointer(Object.assign({ type: 'click', detail: 1 }, middle(press)));
  const clicked = pressLog.filter((l) => !/move/.test(l)).map((l) => l.split(':').slice(0, 3).join(':'));
  check('a tap is a click: down, up, then click', outcome === 'default' &&
    clicked.join() === 'pointerdown:1:0,mousedown:1:0,pointerup:1:0,mouseup:1:0,click:1:0', clicked.join());
  pressLog.length = 0;
  bridge.pointer(Object.assign({ type: 'click', detail: 2 }, middle(press)));
  check('the second of two is a double click', pressLog.some((l) => l.startsWith('click:2')) &&
    pressLog.some((l) => l.startsWith('dblclick:2')), pressLog.join());
  pressLog.length = 0;
  bridge.pointer(Object.assign({ type: 'context' }, middle(press)));
  check('two fingers are the right button, and a context menu', pressLog.some((l) => l.startsWith('contextmenu:1:2')) &&
    pressLog.some((l) => l.startsWith('mousedown:1:2')) && !pressLog.some((l) => l.startsWith('click')), pressLog.join());
  check('a secondary click without a site menu reports no menu to the app',
    __messages.filter((m) => m.kind === 'context').at(-1)?.kept === false);
  const stop = (e) => e.preventDefault();
  press.addEventListener('contextmenu', stop);
  outcome = bridge.pointer(Object.assign({ type: 'context' }, middle(press)));
  check('a site menu reports handled secondary click to the app', outcome === 'handled' &&
    __messages.filter((m) => m.kind === 'context').at(-1)?.kept === true);
  press.removeEventListener('contextmenu', stop);
  press.addEventListener('pointerdown', stop);
  pressLog.length = 0;
  outcome = bridge.pointer(Object.assign({ type: 'click', detail: 1 }, middle(press)));
  check('a cancelled pointerdown keeps the mouse events from the page, and still clicks', outcome === 'handled' &&
    !pressLog.some((l) => /^mouse(down|up)/.test(l)) && pressLog.some((l) => l.startsWith('click')), pressLog.join());
  press.removeEventListener('pointerdown', stop);
  pressLog.length = 0;
  bridge.pointer({ type: 'move', x: 5, y: 5, width: innerWidth });
  check('moving off it is out and leave', pressLog.some((l) => l.startsWith('pointerout')) &&
    pressLog.some((l) => l.startsWith('mouseleave')), pressLog.join());
  check('and its :hover styles go', getComputedStyle(press).color !== 'rgb(1, 2, 3)' &&
    !press.hasAttribute('data-safience-hover'), getComputedStyle(press).color);
  let dragged = null;
  const canvasBox = document.getElementById('canvas');
  canvasBox.addEventListener('mousemove', (e) => { if (e.buttons === 1) dragged = e.clientX; });
  bridge.pointer({ type: 'down', x: 50, y: 50, width: innerWidth });
  bridge.pointer({ type: 'move', x: 150, y: 60, width: innerWidth, buttons: 1 });
  bridge.pointer({ type: 'up', x: 150, y: 60, width: innerWidth });
  check('a press held while the cursor moves is a drag', dragged === 150, dragged);

  const field = document.getElementById('field');
  field.blur();
  bridge.pointer(Object.assign({ type: 'click', detail: 1 }, middle(field)));
  check('a click in a field gives it the focus', document.activeElement === field);
  field.value = '';
  bridge.type({ text: 'h' });
  bridge.type({ text: 'i' });
  check('typing goes into the field', field.value === 'hi', field.value);
  bridge.type({ text: '', back: 1 });
  check('and Backspace takes a character away', field.value === 'h', field.value);
  bridge.type({ text: '👍' });
  check('an emoji, two units long, is one character typed', field.value === 'h👍', field.value);
  field.value = '';
  bridge.type({ text: 'ㅎ' });
  bridge.type({ text: '하', back: 1 });
  bridge.type({ text: '한', back: 1 });
  check('a Korean syllable built by replacing the one before comes out whole', field.value === '한', field.value);
  let sent = false;
  document.getElementById('send').addEventListener('submit', (e) => { sent = true; e.preventDefault(); });
  bridge.key({ key: 'Enter', code: 'Enter' });
  check('Return sends the field\'s form', sent);
  const note = document.getElementById('note');
  bridge.pointer(Object.assign({ type: 'click', detail: 1 }, middle(note)));
  bridge.type({ text: 'ok' });
  check('typing goes into something content-editable', document.activeElement === note && note.textContent === 'ok',
    note.textContent);

  bridge.pointer({ type: 'click', x: 50, y: 50, width: innerWidth, detail: 1 });
  check('a click on nothing focusable takes the focus away', document.activeElement === document.body,
    document.activeElement && document.activeElement.id);
  const keys = [];
  const listen = (e) => keys.push([e.key, e.code, e.keyCode].join(':'));
  window.addEventListener('keydown', listen, true);
  outcome = bridge.type({ text: 'v' });
  check('outside a field a character is a key, for the page\'s shortcuts', outcome === 'keys' && keys[0] === 'v:KeyV:86',
    keys.join());
  outcome = bridge.type({ text: 'x', back: 1 });
  check('and a replacement there is nothing', outcome === 'ignored' && keys.length === 1, outcome + ' ' + keys.join());
  window.removeEventListener('keydown', listen, true);
  // Nothing typed is left behind for the tests of what freezing would lose.
  field.value = '';
  note.textContent = '';
  note.removeAttribute('contenteditable');

  // MARK: Reports

  // Reports are sent on a change only, so each check starts from the other state.
  document.getElementById('hidden').focus();
  await wait(20);
  __messages.length = 0;
  a.focus();
  await wait(20);
  check('a visible field says the keys are for typing', __messages.some((m) => m.kind === 'focus' && m.editing === true));
  __messages.length = 0;
  document.getElementById('hidden').focus();
  await wait(20);
  check('a hidden one says they are not', __messages.some((m) => m.kind === 'focus' && m.editing === false));

  check('no password field yet', bridge.state().password === false);
  __messages.length = 0;
  const password = document.createElement('input');
  password.type = 'Password';
  document.getElementById('form').appendChild(password);
  await wait(600);
  check('a password field makes it a sign-in page', __messages.some((m) => m.kind === 'password' && m.present === true));
  // A tab opened behind draws its sign-in form late: still seen while the page is new.
  password.remove();
  await wait(600);
  Object.defineProperty(document, 'hidden', { configurable: true, get: () => true });
  __messages.length = 0;
  const late = document.createElement('input');
  late.type = 'password';
  document.getElementById('form').appendChild(late);
  await wait(600);
  check('off screen, a new page\'s late password field is seen too', __messages.some((m) => m.kind === 'password' && m.present === true));
  delete document.hidden;

  check('nothing typed, nothing to lose', hasDraft() === false);
  document.getElementById('box').checked = true;
  check('a ticked box is not typing', hasDraft() === false);
  b.value = 'something typed';
  check('something typed is kept from freezing', hasDraft() === true);
  b.value = b.defaultValue;
  b.value = '';
  check('clearing a field keeps the deletion from freezing', hasDraft() === true);
  b.value = b.defaultValue;

  const draft = document.createElement('div');
  document.body.appendChild(draft);
  draft.contentEditable = 'true';
  check('an empty rich editor stays live because its saved state is unknown', hasDraft() === true);
  draft.innerHTML = '<p>A draft with <strong>rich text</strong></p>';
  const richText = draft.innerHTML;
  check('rich content is kept from freezing without changing it', hasDraft() === true && draft.innerHTML === richText);
  draft.hidden = true;
  check('hiding a rich editor does not discard its draft', hasDraft() === true);
  draft.contentEditable = 'plaintext-only';
  check('a plaintext-only rich editor also stays live', hasDraft() === true);
  draft.contentEditable = 'false';
  check('read-only content alone does not hold the page', hasDraft() === false);
  draft.remove();

  // A canvas can hold unsaved work only in private JavaScript state. Even
  // a blank or hidden canvas is unknown, so neither probe may release it.
  const drawing = document.createElement('canvas');
  document.body.appendChild(drawing);
  check('a blank canvas stays live because its saved state is unknown', hasDraft() === true);
  const privateDrawing = { points: [[2, 3], [5, 8]], saved: false };
  const context = drawing.getContext('2d');
  context.fillStyle = '#123456';
  context.fillRect(...privateDrawing.points[0], 4, 4);
  const pixels = drawing.toDataURL();
  check('a canvas-only draft stays live without changing its pixels or private state',
    hasDraft() === true && drawing.toDataURL() === pixels && privateDrawing.saved === false);
  drawing.hidden = true;
  check('a hidden canvas-only draft stays live', hasDraft() === true);
  drawing.remove();
  check('removing the canvas makes the page eligible again', hasDraft() === false);

  const draftHost = document.createElement('div');
  document.body.appendChild(draftHost);
  const draftRoot = draftHost.attachShadow({ mode: 'open' });
  const nestedHost = document.createElement('div');
  draftRoot.appendChild(nestedHost);
  const nestedRoot = nestedHost.attachShadow({ mode: 'open' });
  const shadowField = document.createElement('textarea');
  shadowField.defaultValue = 'saved text';
  nestedRoot.appendChild(shadowField);
  check('an unchanged field in nested open shadow roots can freeze', hasDraft() === false);
  shadowField.value = '';
  check('a deletion inside nested open shadow roots stays live', hasDraft() === true);
  shadowField.value = shadowField.defaultValue;
  const shadowDraft = document.createElement('div');
  shadowDraft.contentEditable = 'true';
  nestedRoot.appendChild(shadowDraft);
  check('an empty editor inside nested open shadow roots stays live', hasDraft() === true);
  shadowDraft.innerHTML = '<p><strong>Shadow draft</strong></p>';
  draftHost.hidden = true;
  check('a hidden shadow editor keeps its rich content', hasDraft() === true && shadowDraft.textContent === 'Shadow draft');
  shadowDraft.contentEditable = 'false';
  check('a read-only shadow editor does not hold the page', hasDraft() === false);
  nestedRoot.appendChild(document.createElement('canvas'));
  check('a hidden canvas inside nested open shadow roots stays live', hasDraft() === true);
  draftHost.remove();

  const frameDocument = document.getElementById('frame').contentDocument;
  const frameField = frameDocument.createElement('textarea');
  frameField.defaultValue = 'saved frame text';
  frameDocument.body.appendChild(frameField);
  check('an unchanged field in a same-origin frame can freeze', hasDraft() === false);
  frameField.value = '';
  check('a deletion inside a same-origin frame stays live', hasDraft() === true);
  frameField.remove();
  const frameDraft = frameDocument.createElement('div');
  frameDraft.contentEditable = 'true';
  frameDraft.innerHTML = '<p><em>Frame draft</em></p>';
  frameDraft.hidden = true;
  frameDocument.body.appendChild(frameDraft);
  check('a hidden rich editor in a same-origin frame stays live', hasDraft() === true);
  frameDraft.remove();
  frameDocument.designMode = 'on';
  check('a designMode document in a same-origin frame stays live', hasDraft() === true);
  frameDocument.designMode = 'off';
  check('removing editors makes the page eligible again', hasDraft() === false);
  const frameCanvas = frameDocument.createElement('canvas');
  frameDocument.body.appendChild(frameCanvas);
  check('a canvas in a same-origin frame stays live', hasDraft() === true);
  frameCanvas.remove();

  const opaqueFrame = document.createElement('iframe');
  opaqueFrame.setAttribute('sandbox', '');
  opaqueFrame.srcdoc = '<!doctype html><div contenteditable>Opaque frame draft</div>';
  const opaqueLoaded = new Promise((resolve) => opaqueFrame.addEventListener('load', resolve, { once: true }));
  document.body.appendChild(opaqueFrame);
  await opaqueLoaded;
  check('an unreadable frame keeps the page live as unknown', hasDraft() === true);
  opaqueFrame.remove();
  check('an unreadable frame stops holding the page after removal', hasDraft() === false);

  const large = document.createElement('div');
  large.innerHTML = '<span></span>'.repeat(20001);
  document.body.appendChild(large);
  check('an incomplete large-page inspection keeps the page live', hasDraft() === true);
  large.remove();
  check('a completed inspection can let the page freeze again', hasDraft() === false);

  const state = bridge.state();
  check('state reports what Diagnostics shows', typeof state.userAgent === 'string' && state.bridged > 0 && state.adapter === 'test');

  // MARK: The cursor

  // A page's own cursor image is drawn to a PNG for the app to show; the
  // pointer goes for cursor: none; any other keyword is the system's.
  const svg = (size, color) => 'data:image/svg+xml,' + encodeURIComponent(
    `<svg xmlns="http://www.w3.org/2000/svg" width="${size}" height="${size}"><rect width="${size}" height="${size}" fill="${color}"/></svg>`);
  const spot = (cursor) => {
    const element = document.createElement('div');
    element.className = 'box';
    element.style.cssText = 'left: 960px; top: 0; width: 60px; height: 60px';
    element.style.cursor = cursor;
    document.body.appendChild(element);
    return element;
  };
  const cursorReports = () => __messages.filter((m) => m.kind === 'cursor');
  async function hover(element) {
    __messages.length = 0;
    element.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, composed: true, pointerType: 'mouse' }));
    for (let i = 0; i < 80 && !cursorReports().length; i++) await wait(25);
    return cursorReports().pop();
  }
  const short = (report) => JSON.stringify(report || null).slice(0, 160);
  const density = Math.min(Math.max(window.devicePixelRatio || 1, 1), 3);

  const plainSpot = spot('default');
  const imageSpot = spot(`url("${svg(32, 'red')}") 4 6, auto`);
  let got = await hover(imageSpot);
  check('a cursor image under the pointer is drawn for the app', got && /^data:image\/png;base64,/.test(got.image || ''), short(got));
  check('at its own size, in CSS pixels', got && got.width === 32 && got.height === 32, short(got));
  check('with its hotspot', got && got.x === 4 && got.y === 6, short(got));
  check('at the screen\'s density', got && got.scale === density, short(got));
  const firstId = got && got.id;
  got = await hover(plainSpot);
  check('a keyword is the system\'s pointer', got && got.keyword === 'default' && !got.image, short(got));
  got = await hover(imageSpot);
  check('a cursor got before goes by its id alone', got && got.id === firstId && !got.image, short(got));
  __messages.length = 0;
  imageSpot.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, composed: true, pointerType: 'mouse' }));
  await wait(150);
  check('and only when it changes', cursorReports().length === 0, short(cursorReports()));
  got = await hover(spot('none'));
  check('cursor: none says none', got && got.keyword === 'none', short(got));
  got = await hover(spot(`url("data:image/png;base64,broken") 1 1, url("${svg(16, 'blue')}") 2 2, crosshair`));
  check('an image that fails gives way to the next', got && got.width === 16 && got.x === 2 && got.y === 2, short(got));
  got = await hover(spot('url("data:image/png;base64,broken"), pointer'));
  check('and to the keyword when none can be drawn', got && got.keyword === 'pointer' && !got.image, short(got));
  got = await hover(spot(`url("${svg(200, 'green')}") 0 0, auto`));
  check('a cursor bigger than 128 is not shown', got && got.keyword === 'auto', short(got));
  got = await hover(spot(`url("${svg(24, 'black')}") 40 -3, auto`));
  check('a hotspot outside the picture is brought in', got && got.x === 24 && got.y === 0, short(got));
  __messages.length = 0;
  plainSpot.dispatchEvent(new PointerEvent('pointermove', { bubbles: true, composed: true, pointerType: 'touch' }));
  await wait(150);
  check('a finger has no cursor', cursorReports().length === 0, short(cursorReports()));
  // A pointer leaving the page leaves the system's pointer behind.
  await hover(imageSpot);
  __messages.length = 0;
  imageSpot.dispatchEvent(new PointerEvent('pointerout', { bubbles: true, composed: true, pointerType: 'mouse', relatedTarget: null }));
  await wait(100);
  check('leaving the page gives back the system\'s pointer', cursorReports().some((m) => m.keyword === 'auto'), short(cursorReports()));
  check('cursor ids are whole numbers the app can read', Number.isSafeInteger(firstId) && firstId > 0, String(firstId));
  // Past 64 cursors the bridge forgets what it sent: one seen before comes
  // with its picture again, under a new id.
  for (let i = 0; i < 66; i++) await hover(spot(`url("${svg(80, 'gray')}") ${i} 1, auto`));
  got = await hover(imageSpot);
  check('past 64 cursors, one seen before is sent with its picture again',
    got && /^data:image\/png;base64,/.test(got.image || '') && got.id !== firstId, short(got));

  const set = bridge.parseCursor('-webkit-image-set(url("a.png") 1x, url("b.png") 2x) 3 4, move');
  check('an image set is read with its densities', set.images.length === 1 && set.images[0].candidates.length === 2 &&
    set.images[0].candidates[1].url === 'b.png' && set.images[0].candidates[1].density === 2 &&
    set.images[0].x === 3 && set.images[0].y === 4 && set.keyword === 'move', JSON.stringify(set));
  const tricky = bridge.parseCursor('url("data:image/svg+xml,<svg fill=\'rgb(1,2,3)\'>\\"x\\"</svg>") 1 2, auto');
  check('a URL with brackets and quotes in it is read whole', tricky.images.length === 1 &&
    tricky.images[0].candidates[0].url === 'data:image/svg+xml,<svg fill=\'rgb(1,2,3)\'>"x"</svg>' && tricky.images[0].y === 2 &&
    tricky.keyword === 'auto', JSON.stringify(tricky));
  check('a keyword alone has no images', bridge.parseCursor('grab').images.length === 0 && bridge.parseCursor('grab').keyword === 'grab');

  // MARK: The site's icon

  const icons = bridge.siteIcons().map((url) => url.replace(location.origin, '').replace(/^.*\/Tests\//, ''));
  check('the site\'s own icon comes first, a drawing before its largest picture', icons[0] === 'icon.svg' &&
    icons[1] === 'icon-48.png', JSON.stringify(icons));
  check('then the touch icon, then a speck under 32 pixels, then the one for a dark screen', icons[2] === 'touch.png' &&
    icons[3] === 'icon-16.png' && icons[4] === 'icon-dark.png', JSON.stringify(icons));
  check('then /favicon.ico, and never a mask icon', icons[5] === '/favicon.ico' && icons.length === 6,
    JSON.stringify(icons));

  // MARK: Hands off

  const off = document.createElement('iframe');
  off.src = 'handsoff.html';
  document.body.appendChild(off);
  await new Promise((resolve) => off.addEventListener('load', resolve, { once: true }));
  const offWindow = off.contentWindow;
  await offWindow.__bridgeReady;
  await wait(50);
  check('on a hands-off host it does nothing at all', offWindow.__ready === true && !('__safience' in offWindow) &&
    offWindow.__messages.length === 0 && offWindow.document.querySelectorAll('style').length === 0);

  window.__results = results;
  const failed = results.filter((r) => !r.ok).length;
  document.title = failed ? 'FAILED ' + failed : 'PASSED ' + results.length;
  document.getElementById('out').textContent = document.title + '\n' + document.getElementById('out').textContent;
})().catch((error) => {
  window.__results = [{ name: 'the test page itself', ok: false, detail: String(error && error.stack || error) }];
  document.title = 'FAILED';
  document.getElementById('out').textContent += '\nstopped: ' + String(error && error.stack || error);
});
</script>
